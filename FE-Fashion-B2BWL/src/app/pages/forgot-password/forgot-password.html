<div class="login-container">
  <div class="top-nav-header">
    <a routerLink="/" class="nav-extra-link"><tui-icon icon="@tui.chevron-left"></tui-icon> TRANG CHỦ</a>
    <a routerLink="/login" class="nav-extra-link">ĐĂNG NHẬP <tui-icon icon="@tui.arrow-right"></tui-icon></a>
  </div>

  <div class="login-box">
    <div class="logo-wrapper">
      <a routerLink="/storefront" class="logo">WSSTYLE <span>LUXE</span></a>
    </div>

    <h3>QUÊN MẬT KHẨU</h3>
    <p class="subtitle">Nhập email đã đăng ký — bạn sẽ nhận liên kết đặt lại mật khẩu.</p>

    <div *ngIf="successMsg" class="success-alert">
      {{ successMsg }}
    </div>
    <div *ngIf="errorMsg" class="error-alert">
      {{ errorMsg }}
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-field">
        <label tuiLabel>ĐỊA CHỈ EMAIL</label>
        <tui-textfield tuiTextfieldSize="m">
          <input tuiTextfield type="email" formControlName="email" placeholder="example@mail.com" />
        </tui-textfield>
        <tui-error formControlName="email" [error]="[] | tuiFieldError | async"></tui-error>
      </div>

      <div class="actions">
        <button tuiButton type="submit" appearance="primary" [disabled]="loading" class="submit-btn">
          GỬI LIÊN KẾT
        </button>
      </div>
    </form>

    <div class="footer-links">
      <span>Đã nhớ mật khẩu?</span>
      <a routerLink="/login">Đăng nhập</a>
    </div>
  </div>
</div>
