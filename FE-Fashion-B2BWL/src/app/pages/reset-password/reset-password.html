<div class="login-container">
  <div class="top-nav-header">
    <a routerLink="/" class="nav-extra-link"><tui-icon icon="@tui.chevron-left"></tui-icon> TRANG CHỦ</a>
    <a routerLink="/login" class="nav-extra-link">ĐĂNG NHẬP <tui-icon icon="@tui.arrow-right"></tui-icon></a>
  </div>

  <div class="login-box">
    <div class="logo-wrapper">
      <a routerLink="/storefront" class="logo">WSSTYLE <span>LUXE</span></a>
    </div>

    <h3>ĐẶT LẠI MẬT KHẨU</h3>
    <p class="subtitle">Nhập mật khẩu mới cho tài khoản của bạn.</p>

    <div *ngIf="successMsg" class="success-alert">
      {{ successMsg }}
    </div>
    <div *ngIf="errorMsg" class="error-alert">
      {{ errorMsg }}
    </div>

    <form *ngIf="token" [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-field">
        <label tuiLabel>MẬT KHẨU MỚI</label>
        <tui-textfield tuiTextfieldSize="m" tuiPassword>
          <input tuiTextfield type="password" formControlName="password" placeholder="••••••••" />
        </tui-textfield>
        <tui-error formControlName="password" [error]="[] | tuiFieldError | async"></tui-error>
      </div>

      <div class="form-field">
        <label tuiLabel>XÁC NHẬN MẬT KHẨU</label>
        <tui-textfield tuiTextfieldSize="m" tuiPassword>
          <input tuiTextfield type="password" formControlName="confirm" placeholder="••••••••" />
        </tui-textfield>
        <tui-error formControlName="confirm" [error]="[] | tuiFieldError | async"></tui-error>
      </div>

      <div class="actions">
        <button tuiButton type="submit" appearance="primary" [disabled]="loading" class="submit-btn">
          CẬP NHẬT MẬT KHẨU
        </button>
      </div>
    </form>

    <div *ngIf="!token" class="error-alert">
      Liên kết không hợp lệ. Vui lòng mở lại đường dẫn từ email hoặc yêu cầu gửi lại.
    </div>

    <div class="footer-links">
      <span>Đã có tài khoản?</span>
      <a routerLink="/login">Đăng nhập</a>
    </div>
  </div>
</div>
