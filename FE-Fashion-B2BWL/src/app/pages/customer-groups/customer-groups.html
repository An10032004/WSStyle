<div class="page-container">
  <div class="page-header">
    <h2 class="tui-text_h3 page-header__title">{{ 'MEMBER.GROUPS_TITLE' | transloco }}</h2>
    <div class="page-actions">
      <button tuiButton type="button" size="m" appearance="primary" iconStart="@tui.plus" (click)="onAdd()">
        {{ 'COMMON.ADD' | transloco }}
      </button>
    </div>
  </div>

  <div *ngIf="showForm" class="form-panel">
    <h4>{{ editingId ? ('COMMON.EDIT' | transloco) : ('COMMON.ADD' | transloco) }}</h4>
    
    <div class="form-grid">
      <label tuiLabel class="form-field full-width">
        {{ 'MEMBER.GROUP_NAME' | transloco }}
        <tui-textfield>
          <input tuiTextfield [(ngModel)]="formData.name" />
        </tui-textfield>
      </label>

    </div>

    <div class="form-actions">
      <button tuiButton type="button" appearance="outline" size="m" (click)="cancel()">{{ 'COMMON.CANCEL' | transloco }}</button>
      <button tuiButton type="button" appearance="primary" size="m" iconStart="@tui.save" (click)="onSubmit()">{{ 'COMMON.SAVE' | transloco }}</button>
    </div>
  </div>

  <div *ngIf="!showForm" class="grid-wrapper">
    <div class="premium-grid-wrapper">
      <ag-grid-angular
        class="ag-theme-quartz"
        style="height: 600px; width: 100%;"
        [rowData]="rowData"
        [columnDefs]="columnDefs"
        [pagination]="true"
        [paginationPageSize]="10"
        [paginationPageSizeSelector]="[5, 10, 20, 50, 100]"
        [localeText]="localeText"
        (gridReady)="onGridReady($event)"
        [animateRows]="true"
      ></ag-grid-angular>
    </div>
  </div>
</div>

<ng-template #deleteDialog let-observer>
  <div style="display: flex; gap: 16px; align-items: flex-start; padding: 4px;">
    <tui-icon icon="@tui.triangle-alert" style="font-size: 24px; color: #d97706;"></tui-icon>
    <div>
      <h3 style="margin: 0 0 8px;">Xác nhận xóa</h3>
      <p style="margin: 0; color: #666;">Bạn có chắc chắn muốn xóa nhóm khách hàng <strong>{{ deleteTargetName }}</strong> này không?</p>
    </div>
  </div>
  <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px;">
    <button tuiButton size="m" appearance="outline" (click)="observer.next(false); observer.complete()">Hủy</button>
    <button tuiButton size="m" appearance="accent" (click)="observer.next(true); observer.complete()">Xác nhận xóa</button>
  </div>
</ng-template>

<ng-template #viewDialog let-observer>
  <div class="view-detail" *ngIf="selectedGroup">
    <div class="detail-row">
      <span class="label">ID:</span>
      <span class="value">{{ selectedGroup.id }}</span>
    </div>
    <div class="detail-row">
      <span class="label">{{ 'MEMBER.GROUP_NAME' | transloco }}:</span>
      <span class="value">{{ selectedGroup.name }}</span>
    </div>
  </div>
  <div style="display: flex; justify-content: flex-end; margin-top: 24px;">
    <button tuiButton size="m" (click)="observer.complete()">{{ 'COMMON.CLOSE' | transloco }}</button>
  </div>
</ng-template>
