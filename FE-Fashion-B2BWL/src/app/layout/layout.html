<div class="app-container">
  <!-- HEADER -->
  <header class="app-header">
    <div class="header-left">
      <button
        appearance="flat-grayscale"
        iconStart="@tui.menu"
        size="m"
        tuiIconButton
        type="button"
        class="menu-toggle"
        (click)="sidebarExpanded = !sidebarExpanded"
      ></button>

      <a class="brand-logo" routerLink="/admin">
        <div class="brand-icon">
          <tui-icon icon="@tui.store" />
        </div>
        <span class="brand-name">WSSTYLE ADMIN</span>
      </a>
    </div>

    <div class="header-right">
      <app-language-switcher></app-language-switcher>
      <button
        appearance="flat-grayscale"
        iconStart="@tui.bell"
        size="m"
        tuiIconButton
        type="button"
        class="action-btn"
      ></button>
      <button
        appearance="flat-grayscale"
        iconStart="@tui.settings"
        size="m"
        tuiIconButton
        type="button"
        class="action-btn"
      ></button>
      <div 
        class="user-profile"
        (click)="open = !open"
        [tuiDropdown]="profileMenu"
        [(tuiDropdownOpen)]="open"
        tuiDropdownAlign="right"
      >
        <tui-avatar appearance="primary" size="s">
          {{ user?.fullName?.charAt(0) || 'A' }}
        </tui-avatar>
        <span class="user-name">{{ user?.fullName || 'Administrator' }}</span>
        <tui-icon icon="@tui.chevron-down" class="dropdown-icon" />
      </div>

      <ng-template #profileMenu>
        <tui-data-list>
          <button tuiOption (click)="viewProfile()">
            <tui-icon icon="@tui.user" />
            {{ 'MEMBER.PROFILE' | transloco }}
          </button>
          <button tuiOption (click)="logout()">
            <tui-icon icon="@tui.log-out" />
            {{ 'AUTH.LOGOUT' | transloco }}
          </button>
        </tui-data-list>
      </ng-template>
    </div>
  </header>

  <div class="app-body">
    <!-- SIDEBAR -->
    <app-sidebar [(expanded)]="sidebarExpanded"></app-sidebar>

    <!-- MAIN CONTENT -->
    <main class="app-main">
      <div class="main-container">
        <router-outlet />
      </div>
    </main>
  </div>
</div>
